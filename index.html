    button{font:inherit;color:inherit}.app{max-width:1180px;margin:auto;padding:20px}.topbar{background:rgba(255,255,255,.92);border:2px solid rgba(23,107,69,.12);box-shadow:var(--shadow);border-radius:24px;padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}

    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.level-group{display:flex;background:#e9f3e6;padding:4px;border-radius:14px}.level,.shuffle,.tool{border:0;cursor:pointer;font-weight:800;min-height:44px}.level{background:transparent;border-radius:11px;padding:0 15px}.level.active{background:var(--green);color:white;box-shadow:0 4px 10px rgba(23,107,69,.25)}.shuffle{background:var(--sun);padding:0 18px;border-radius:14px;box-shadow:0 5px 0 #d6a82f}.shuffle:active{transform:translateY(3px);box-shadow:0 2px 0 #d6a82f}

    .board-help{display:flex;gap:12px;justify-content:space-between;margin-top:14px;font-weight:700;color:#406052}.legend{display:flex;gap:12px;flex-wrap:wrap}.key{display:flex;align-items:center;gap:5px}.swatch{width:17px;height:17px;border-radius:5px;background:#ffd8cf;border:1px solid #e49e8e}.swatch.o{display:grid;place-items:center;background:white;color:#1785bb;font-size:18px;font-weight:900}.swatch.o:before{content:"○"}
    .sidebar{display:grid;gap:14px}.side-card{padding:18px}.side-card h2{margin:0 0 12px;font-size:1.12rem}.toolbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool{background:#f2f8e7;border:2px solid #c7daa9;border-radius:16px;padding:12px 8px;display:flex;gap:8px;align-items:center;justify-content:center}.tool .emoji{font-size:1.8rem}.tool.active{border-color:var(--green);background:#d9efac;box-shadow:0 0 0 3px rgba(23,107,69,.12)}
    .tool:disabled{cursor:not-allowed;opacity:.42;filter:grayscale(.65);box-shadow:none}.tool.attack-tool{background:#fff0e2;border-color:#e7aa72}.tool.attack-tool.active{background:#ffd8b2;border-color:#d76b2e}.animal-card{min-height:180px;background:linear-gradient(145deg,#fff7d7,#fff);position:relative;overflow:hidden}.animal-card .empty{color:#62766d;line-height:1.65}.animal-info{display:none}.animal-info.show{display:block}.animal-title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem}.animal-title .big{font-size:2.5rem}.direction-box{background:white;border:2px dashed #e0b84d;border-radius:14px;padding:12px;margin-top:10px}.direction-box strong{color:#8c5916}.tip{font-size:.92rem;color:#526b60;margin-top:10px;line-height:1.5}

  </main><div id="confetti" class="confetti" aria-hidden="true"></div>
  <script>
  (()=>{
    const SIZE=5;
    const DIRECTIONS=[{v:[-1,0],s:'↑',n:'위'},{v:[1,0],s:'↓',n:'아래'},{v:[0,-1],s:'←',n:'왼쪽'},{v:[0,1],s:'→',n:'오른쪽'},{v:[-1,-1],s:'↖',n:'왼쪽 위'},{v:[-1,1],s:'↗',n:'오른쪽 위'},{v:[1,-1],s:'↙',n:'왼쪽 아래'},{v:[1,1],s:'↘',n:'오른쪽 아래'}];
    const ARROW_MARKS=['▲','▼','◀','▶','◤','◥','◣','◢'];
    const ANIMALS={
      pig:{name:'돼지',emoji:'🐗',directionIndexes:[0,1,2,3],range:1},
      scorpion:{name:'전갈',emoji:'🦂',directionIndexes:[4,5,6,7],range:1},
      lion:{name:'사자',emoji:'🦁',directionIndexes:[0,1,2,3,4,5,6,7],range:1},
      hippo:{name:'하마',emoji:'🦛',directionIndexes:[0,1,2,3],range:9},
      elephant:{name:'코끼리',emoji:'🐘',directionIndexes:[4,5,6,7],range:9},
      leopard:{name:'표범',emoji:'🐆',directionIndexes:[0,1,2,3,4,5,6,7],range:9}
    };
    const CONFIG={easy:{animals:3,rocks:2,safeCells:3,title:'초급 탐험',stars:'⭐'},medium:{animals:4,rocks:3,safeCells:2,title:'중급 탐험',stars:'⭐⭐'},hard:{animals:6,rocks:5,safeCells:1,title:'고급 탐험',stars:'⭐⭐⭐'}};
    let level='easy', board=[], selectedAnimal=null, selectedTool='explore', ranger=null, marks=new Set(), correctGuesses=new Set(), wrongGuesses=new Set(), attackTimers=[];
    const $=s=>document.querySelector(s), boardEl=$('#board');
    const key=(r,c)=>r+'-'+c, inside=(r,c)=>r>=0&&r<SIZE&&c>=0&&c<SIZE, pick=a=>a[Math.floor(Math.random()*a.length)];
    function setStatus(type,icon,text){const el=$('#status');el.className='status '+type;$('.status-icon').textContent=icon;$('#statusText').textContent=text}
    function attacksFrom(piece){const cells=[];for(const d of piece.dirs){let r=piece.r+d.v[0],c=piece.c+d.v[1],steps=0;while(inside(r,c)&&steps<piece.range){const at=board[r][c];if(at?.type==='rock') break;cells.push([r,c]);r+=d.v[0];c+=d.v[1];steps++}}return cells}
    function allAttacks(){const map=new Map();board.flat().filter(x=>x?.type==='animal').forEach(a=>attacksFrom(a).forEach(([r,c])=>{const k=key(r,c);if(!map.has(k))map.set(k,[]);map.get(k).push(a)}));return map}
    function possibleSafeCells(){const danger=allAttacks();const out=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c]&&!danger.has(key(r,c)))out.push([r,c]);return out}
    function makeProblem(){attackTimers.forEach(clearTimeout);attackTimers=[];selectedAnimal=null;selectedTool='explore';ranger=null;marks.clear();correctGuesses.clear();wrongGuesses.clear();document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.dataset.tool==='explore'));const rangerButton=document.querySelector('[data-tool="ranger"]');rangerButton.disabled=true;rangerButton.setAttribute('aria-disabled','true');const cfg=CONFIG[level];let made=false;for(let tries=0;tries<10000;tries++){board=Array.from({length:SIZE},()=>Array(SIZE).fill(null));const spots=Array.from({length:25},(_,i)=>[Math.floor(i/5),i%5]).sort(()=>Math.random()-.5);let idx=0;Object.keys(ANIMALS).sort(()=>Math.random()-.5).slice(0,cfg.animals).forEach(kind=>{const [r,c]=spots[idx++],rule=ANIMALS[kind];board[r][c]={type:'animal',kind,r,c,dirs:rule.directionIndexes.map(i=>DIRECTIONS[i]),range:rule.range}});for(let i=0;i<cfg.rocks;i++){const[r,c]=spots[idx++];board[r][c]={type:'rock',r,c}}if(possibleSafeCells().length===cfg.safeCells){made=true;break}}if(!made){setStatus('warn','🔄','문제를 다시 만들고 있어요. 새 문제를 한 번 더 눌러 주세요.');return}$('#missionTitle').textContent=cfg.title;$('#stars').textContent=cfg.stars;clearInfo();render();setStatus('info','🔎','참고용 탐색입니다. 동물 조각을 눌러 공격 방향과 거리를 살펴보세요.')}
    function render(){boardEl.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const k=key(r,c),cell=document.createElement('button');cell.className='cell'+(marks.has(k)?' marked':'')+(correctGuesses.has(k)?' guess-correct':'')+(wrongGuesses.has(k)?' guess-wrong':'');cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',(r+1)+'행 '+(c+1)+'열');cell.dataset.r=r;cell.dataset.c=c;const p=board[r][c];if(p?.type==='animal'){const span=document.createElement('span');span.className='piece animal'+(selectedAnimal===p?' selected':'');span.textContent=ANIMALS[p.kind].emoji;cell.append(span);const ring=document.createElement('span');ring.className='arrow-ring';p.dirs.forEach(d=>{const i=DIRECTIONS.indexOf(d),marker=document.createElement('span');marker.className='dir-marker dir-'+i;marker.textContent=ARROW_MARKS[i].repeat(p.range===1?1:2);ring.append(marker)});cell.append(ring);cell.setAttribute('aria-label',ANIMALS[p.kind].name+', '+p.dirs.map(d=>d.n).join('과 ')+' 방향')}else if(p?.type==='rock'){cell.innerHTML='<span class="piece">🪨</span>';cell.setAttribute('aria-label','바위')}if(ranger&&ranger.r===r&&ranger.c===c){cell.innerHTML='<span class="piece ranger">🧑‍🌾</span>';cell.setAttribute('aria-label','레인저')}cell.addEventListener('click',onCell);boardEl.append(cell)}}
    function clearHighlights(){attackTimers.forEach(clearTimeout);attackTimers=[];document.querySelectorAll('.cell.attack,.cell.unsafe').forEach(x=>x.classList.remove('attack','unsafe'))}
    function showAttack(p){clearHighlights();selectedAnimal=p;render();const data=ANIMALS[p.kind];$('#emptyInfo').style.display='none';$('#animalInfo').classList.add('show');$('#infoEmoji').textContent=data.emoji;$('#infoName').textContent=data.name;$('#infoArrows').textContent=p.dirs.map(d=>d.s+' '+d.n).join(', ');$('#infoRange').textContent=p.range===1?'1칸':'판의 끝까지';$('#infoTip').textContent=p.range===1?'빨간 표시가 한 개인 방향은 바로 옆 한 칸을 공격해요.':'빨간 표시가 두 개인 방향은 판의 끝까지 공격해요. 바위를 만나면 바위부터 그 뒤는 안전해요.';const cells=attacksFrom(p);cells.forEach(([r,c],i)=>attackTimers.push(setTimeout(()=>{const el=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);el?.classList.add('attack')},110*(i+1))));setStatus('info','🔎',data.name+'의 공격 칸을 한 칸씩 확인해 보세요.')}
    function clearInfo(){$('#emptyInfo').style.display='block';$('#animalInfo').classList.remove('show')}
    function onCell(e){const r=+e.currentTarget.dataset.r,c=+e.currentTarget.dataset.c,p=board[r][c];if(selectedTool==='attack'){checkAttackGuess(r,c);return}if(selectedTool==='explore'){if(p?.type==='animal')showAttack(p);else setStatus('info','🔎','동물 조각을 눌러 공격 방향과 거리를 살펴보세요.');return}if(p?.type==='animal'){showAttack(p);return}if(p){setStatus('warn','✋','이 칸에는 이미 조각이 있어요.');return}ranger={r,c};marks.add(key(r,c));render();grade()}
    function checkAttackGuess(r,c){if(board[r][c]){setStatus('warn','✋','동물 조각과 바위가 없는 빈칸만 선택하세요.');return}const k=key(r,c),danger=allAttacks(),attackers=danger.get(k)||[],correct=attackers.length>0;correctGuesses.delete(k);wrongGuesses.delete(k);(correct?correctGuesses:wrongGuesses).add(k);render();if(correct){const required=[...danger.keys()].filter(cell=>{const[rr,cc]=cell.split('-').map(Number);return !board[rr][cc]});const allFound=required.every(cell=>correctGuesses.has(cell));if(allFound){const rangerButton=document.querySelector('[data-tool="ranger"]');rangerButton.disabled=false;rangerButton.setAttribute('aria-disabled','false');setStatus('success','🧑‍🌾','빈칸의 모든 공격 범위를 찾았어요! 이제 레인저 놓기를 선택하세요.')}else{const names=[...new Set(attackers.map(a=>ANIMALS[a.kind].name))];setStatus('success','⭕','맞아요! '+names.join('·')+'의 공격 범위예요. 남은 공격 칸도 찾아보세요.')}}else{setStatus('warn','❌','어떤 동물의 공격 범위도 아닙니다.');beep()}}
    function beep(){try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=740;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.1)}catch(e){}}
    function grade(){clearHighlights();const attackers=allAttacks().get(key(ranger.r,ranger.c))||[];if(!attackers.length){setStatus('success','🎉','성공! 레인저가 모든 동물의 공격을 피했어요.');celebrate();tone(true)}else{const names=[...new Set(attackers.map(a=>ANIMALS[a.kind].name))];const cell=document.querySelector(`[data-r="${ranger.r}"][data-c="${ranger.c}"]`);cell?.classList.add('unsafe');setStatus('warn','⚠️','주의! '+names.join('·')+'의 공격 경로에 있어요. 다른 칸을 찾아보세요.');tone(false)}}
    function celebrate(){const box=$('#confetti');box.innerHTML='';const colors=['#ffd35c','#e34c4c','#42a5d8','#68b85b'];for(let i=0;i<36;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=pick(colors);x.style.animationDelay=Math.random()*.5+'s';box.append(x)}setTimeout(()=>box.innerHTML='',2300)}
    function tone(ok){try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C();[0,1,2].forEach(i=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?[523,659,784][i]:[220,180,150][i];g.gain.setValueAtTime(.05,ctx.currentTime+i*.11);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.11+.15);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+i*.11);o.stop(ctx.currentTime+i*.11+.16)})}catch(e){}}
    document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level;makeProblem()}));
    document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedTool=b.dataset.tool;clearHighlights();if(selectedTool==='attack'){selectedAnimal=null;clearInfo();render();setStatus('info','🎯','놓여 있는 모든 동물의 공격 범위를 찾아 칸을 눌러 보세요.')}else if(selectedTool==='explore'){selectedAnimal=null;clearInfo();render();setStatus('info','🔎','참고용 탐색입니다. 동물 조각을 눌러 공격 방향과 거리를 살펴보세요.')}else setStatus('info','🧑‍🌾','레인저를 놓을 빈 칸을 누르세요.')}));$('#shuffle').addEventListener('click',makeProblem);
    if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'start_new_safari_problem',title:'새 사파리 문제 시작',description:'선택한 난이도로 새 문제를 생성합니다.',inputSchema:{type:'object',properties:{level:{type:'string',enum:['easy','medium','hard']}},required:['level'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({level:newLevel})=>{if(!CONFIG[newLevel])throw new Error('지원하지 않는 난이도');level=newLevel;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x.dataset.level===level));makeProblem();return{level,safe_cell_count:possibleSafeCells().length}}})}
    makeProblem();
  })();
  </script>
</body></html>
